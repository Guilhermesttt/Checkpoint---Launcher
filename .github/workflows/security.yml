name: Security Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # Toda segunda-feira às 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run security:audit
      - run: npm run security:gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-gate-report
          path: artifacts/security-gate.json
          if-no-files-found: ignore
