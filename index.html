  <meta name="author" content="Checkpoint Launcher" />

  <meta name="theme-color" content="#0a0a0a" />

    content="Organize toda sua biblioteca da Steam, Epic e jogos Locais em uma interface premium, amigável para controle e super rápida." />

      "operatingSystem": "Windows",

        "priceCurrency": "USD"

      "description": "Um launcher universal para unir jogos da Steam, Epic Games e Locais em uma única interface limpa, premium e otimizada para controles.",
      "url": "https://checkpoint-launcher.netlify.app/"
    }
  </script>
